  <script src="rain.js"></script>

    <div class="growing-grass">

        <div class="flower__g-fr__leaf flower__g-fr__leaf--8"></div>
      </div>
    </div>

    <div class="long-g long-g--0">
      <div class="grow-ans" style="--d:3s">
        <div class="leaf leaf--0"></div>
      </div>
      <div class="grow-ans" style="--d:2.2s">

      </div>
      <div class="grow-ans" style="--d:3.6s">

        <div class="leaf leaf--2"></div>

      <div class="grow-ans" style="--d:4.2s">

  <!-- KHUNG LỜI THOẠI & DORAEMON LÀM NŨNG PHÍA DƯỚI NHỮNG BÔNG HOA -->
  <section class="flower-bottom-section hidden" id="bottomSection">
    <div class="bottom-story-card">
      <!-- Ảnh Doraemon làm nũng (đã xóa phông trắng) -->
      <div class="doraemon-nung-box">
        <img src="assets/processed/doremon_lam_nung.png" alt="Doraemon làm nũng" class="doraemon-nung-img"
          id="doraemonNungImg">

      </div>

      <!-- Khung chữ chạy lời thoại -->
      <div class="bottom-speech-bubble">
        <p class="bottom-typewriter" id="bottomText"></p>
        <span class="bottom-cursor" id="bottomCursor">|</span>
      </div>
    </div>

    <!-- Nút Tiếp theo chuyển trang tiếp theo -->
    <div class="next-step-container hidden" id="nextStepContainer">
      <button id="nextPage4Btn" class="story-btn next-step-btn">Tiếp theo ➔</button>
    </div>
  </section>

  <!-- Nhạc nền từ trang trước tiếp tục phát & âm thanh gõ phím -->
